    <!-- Structured Data for Google SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Samuel Ndayambaje",
      "jobTitle": "Full-Stack Software Engineer",
      "url": "https://samportfolio-beta.vercel.app/",
      "sameAs": [
        "https://github.com/Samlite250",
        "https://linkedin.com/in/SamuelNdayambaje"
      ],
      "knowsAbout": ["Web Development", "React", "Node.js", "System Architecture", "Database Management", "UI/UX Design"]
    }
    </script>

    <!-- Apply theme before react mounts -->
    <script>
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body class="bg-light-800 dark:bg-dark-900 text-gray-900 dark:text-gray-100 font-sans antialiased overflow-x-hidden selection:bg-primary/30 selection:text-gray-900">
