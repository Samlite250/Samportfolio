<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samuel - Full-Stack Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="title" content="Samuel - Full-Stack Software Engineer">
    <meta name="description" content="Portfolio of Samuel Ndayambaje, a Full-Stack Software Engineer specializing in modern web technologies.">
    <!-- Open Graph / WhatsApp / Social Media Previews -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://samportfolio-beta.vercel.app/">
    <meta property="og:title" content="Samuel - Portfolio">
    <meta property="og:description" content="Portfolio of Samuel Ndayambaje, a Full-Stack Software Engineer specializing in scalable architectures and premium UI.">
    <meta property="og:image" content="https://samportfolio-beta.vercel.app/images/favicon.jpeg">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <!-- Apply theme before react mounts -->
    <script>
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body class="bg-light-800 dark:bg-dark-900 text-gray-900 dark:text-gray-100 font-sans antialiased overflow-x-hidden selection:bg-primary/30 selection:text-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
